name: Altare launcher smoke checks
on:
  push:
    branches: [feature/altare-tiennvo-socks5-cli]
  pull_request:
    paths:
      - 'app.py'
      - 'altare/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/altare-smoke.yml'
jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q app.py altare scripts tests
      - run: python -m unittest discover -s tests -v
